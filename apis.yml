name: Enveda
description: 'Enveda is a Boulder, Colorado based drug discovery company that combines
  artificial intelligence with the chemistry of nature to accelerate the development
  of new medicines. Its platform mines the vast chemical diversity of plants and other
  natural sources, using machine learning to decode complex natural compounds, identify
  their chemical structures and biological activity, and surface novel drug candidates
  faster than traditional approaches. Enveda was surfaced as a portfolio company of
  True Ventures and added to the API Evangelist network. As a private biotechnology
  and drug discovery firm it publishes a corporate and scientific web presence rather
  than a public developer API, so this profile captures its identity, security posture,
  and web properties.'
